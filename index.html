<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>PUBG UC · شراء</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Tahoma,system-ui,-apple-system,sans-serif}html,body{overscroll-behavior:none}body{background:#f5f7fa;display:flex;justify-content:center;min-height:100vh}.page,.card{width:100%}.card{background:#fff;overflow:hidden}.top-image{line-height:0}.top-image img{width:100%;height:auto;display:block}.content{padding:18px 16px 24px}
.user-section,.country-section{background:#f0f2f5;border-radius:28px;border:1px solid #e0e4e8;height:56px;display:flex;align-items:center;gap:10px;position:relative}.user-section{padding:6px 18px 6px 12px;margin-bottom:12px;flex-direction:row-reverse}.user-section i{color:#777;font-size:18px;order:3}.user-section input{background:transparent;border:0;outline:0;font-size:16px;padding:10px 0;flex:1;min-width:100px;text-align:left;direction:ltr;order:1}.user-section input::placeholder{color:#999;text-align:right;direction:rtl;font-size:14px}.player-error-msg,.player-confirm-msg,.player-ok-msg{display:none;order:2;border-radius:20px;white-space:nowrap}.player-error-msg.show{display:inline-block;color:#dc2626;font-size:11px;font-weight:600;background:#fee2e2;padding:3px 10px}.player-confirm-msg.show{display:inline-block;color:#1a73e8;font-size:12px;font-weight:600;background:#e8f0fe;padding:4px 12px}.player-ok-msg.show{display:inline-block;color:#888;font-size:13px;font-weight:700;background:#e8eaed;padding:4px 12px}.spinner-icon{display:inline-block;width:14px;height:14px;border:2px solid #ccc;border-top:2px solid #888;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle}@keyframes spin{to{transform:rotate(360deg)}}
.country-section{padding:6px 18px;margin-bottom:24px;flex-direction:row-reverse;cursor:pointer}.country-label{font-size:14px;font-weight:700;color:#555;white-space:nowrap;order:3}.country-section select{display:none}.select-arrow{order:2;color:#555;font-size:12px}.country-display{order:1;flex:1;font-size:14px;font-weight:600;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.custom-dropdown{display:none;position:absolute;top:100%;left:0;right:0;background:#fff;border-radius:16px;box-shadow:0 10px 30px #0002;max-height:300px;overflow-y:auto;z-index:1000;margin-top:6px;border:1px solid #e0e4e8}.custom-dropdown.active{display:block}.custom-dropdown-item{padding:12px 16px;font-size:14px;cursor:pointer;border-bottom:1px solid #f0f2f5}.custom-dropdown-item.selected{background:#e8f0fe;font-weight:600}
.coin-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:24px}.coin-option{background:#f8f9fc;border-radius:16px;padding:16px 8px;text-align:center;border:2px solid #e8ecf1;cursor:pointer}.coin-option.selected{border-color:#1a73e8;background:#e8f0fe;box-shadow:0 0 0 1px #1a73e8}.uc-symbol{display:inline-flex;width:72px;height:72px;margin:0 auto 6px}.uc-icon-img{width:100%;height:100%;object-fit:contain}.coins{font-weight:700;font-size:18px;margin-top:4px;direction:ltr}.total-price{font-size:14px;font-weight:700;color:#1a73e8;background:#e8f0fe;padding:4px 10px;border-radius:20px;display:inline-block;margin-top:6px;border:1px solid #7baaf7}
.action-btn{width:100%;background:#1a73e8;border:0;padding:16px;border-radius:60px;font-weight:700;font-size:18px;color:#fff;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 8px 0 #0d47a1;cursor:pointer}.action-btn:disabled{opacity:.7}.loading-overlay{display:none;position:fixed;inset:0;background:#0008;backdrop-filter:blur(4px);justify-content:center;align-items:center;z-index:1300;padding:24px}.loading-overlay.active{display:flex}.loading-card{background:#fff;max-width:300px;width:100%;border-radius:32px;padding:40px 24px;text-align:center}.loading-spinner{width:64px;height:64px;margin:0 auto 20px;border:6px solid #e0e4e8;border-top:6px solid #1a73e8;border-radius:50%;animation:spin .8s linear infinite}.loading-card p{font-weight:700}.loading-sub{font-size:13px;color:#888;margin-top:6px}@media(max-width:400px){.content{padding:14px 12px 24px}.coin-option .coins{font-size:16px}.coin-option .uc-symbol{width:60px;height:60px}.user-section,.country-section{height:50px}}
</style>
</head>
<body>
<div class="page"><div class="card">
<div class="top-image"><img src="https://raw.githubusercontent.com/pubgmobil-midasbuy/midasbuy.com/main/IMG_٢٠٢٦٠٩١٢_١٢٤٢١٦.webp" alt="PUBG Mobile"></div>
<div class="content">
<div class="user-section"><i class="fas fa-user"></i><input type="text" id="username" inputmode="numeric" placeholder="ID معرف اللاعب" maxlength="15" autocomplete="off"><span class="player-ok-msg" id="playerOkMsg"><span class="spinner-icon"></span></span><span class="player-confirm-msg" id="playerConfirmMsg"><i class="fas fa-check-circle"></i> تم تحديد اللاعب</span><span class="player-error-msg" id="playerErrorMsg"><i class="fas fa-exclamation-circle"></i> معرف اللاعب غير صحيح</span></div>
<div class="country-section" id="countrySection"><span class="country-label">العملة</span><i class="fas fa-chevron-down select-arrow"></i><span class="country-display" id="countryDisplay">🇪🇬 جنيه مصري</span><select id="countrySelect"></select><div class="custom-dropdown" id="customDropdown"></div></div>
<div class="coin-grid" id="coinGrid"></div>
<button class="action-btn" id="proceedBtn">متابعة الدفع <i class="fas fa-arrow-left"></i></button>
</div></div></div>
<div class="loading-overlay" id="loadingOverlay"><div class="loading-card"><div class="loading-spinner"></div><p>جاري التحويل للدفع...</p><div class="loading-sub">يرجى الانتظار</div></div></div>

<script>
(()=>{const UC_ICON='https://raw.githubusercontent.com/pubgmobil-midasbuy/midasbuy.com/main/IMG_٢٠٢٦٠٩٠٠٧_٢١٠٧٢٨.webp';
const EGP_RATE=48, packages=[500,1000,2000,4000,8000,16000].map((coins,i)=>({coins,priceUSD:(280*Math.pow(2,i))/EGP_RATE}));
const currencies=[
['EGP','🇪🇬 جنيه مصري','ج.م',48],['USD','🇺🇸 دولار أمريكي','$',1],['SAR','🇸🇦 ريال سعودي','ر.س',3.75],['AED','🇦🇪 درهم إماراتي','د.إ',3.67],['KWD','🇰🇼 دينار كويتي','د.ك',.30],['QAR','🇶🇦 ريال قطري','ر.ق',3.64],['BHD','🇧🇭 دينار بحريني','د.ب',.376],['OMR','🇴🇲 ريال عماني','ر.ع',.385],['MAD','🇲🇦 درهم مغربي','د.م.',10.1],['DZD','🇩🇿 دينار جزائري','د.ج',134.5],['TND','🇹🇳 دينار تونسي','د.ت',3.12],['EUR','🇪🇺 يورو','€',.92],['GBP','🇬🇧 جنيه إسترليني','£',.79],['TRY','🇹🇷 ليرة تركية','₺',32],['JOD','🇯🇴 دينار أردني','د.أ',.709],['IQD','🇮🇶 دينار عراقي','ع.د',1310],['INR','🇮🇳 روبية هندية','₹',83.5],['PKR','🇵🇰 روبية باكستانية','₨',278],['CNY','🇨🇳 يوان صيني','¥',7.25],['JPY','🇯🇵 ين ياباني','¥',157],['KRW','🇰🇷 وون كوري','₩',1380],['NGN','🇳🇬 نيرة نيجيرية','₦',1500],['ZAR','🇿🇦 راند جنوب أفريقي','R',18.5],['AUD','🇦🇺 دولار أسترالي','A$',1.52]];
const cd=Object.fromEntries(currencies.map(x=>[x[0],{symbol:x[2],rate:x[3]}])), $=id=>document.getElementById(id);
let selectedCoins=500,selectedPrice=280,okTimer,lastUsername='';
function valid(v){return /^[1-9][0-9]{7,14}$/.test(v)} function fmt(v){v=+v.toFixed(2);return Number.isInteger(v)?v.toFixed(0):v.toFixed(2)}
const cs=$('countrySelect');currencies.forEach(c=>{let o=document.createElement('option');o.value=c[0];o.textContent=c[1];cs.appendChild(o)});
$('countryDisplay').textContent=cs.options[0].text;
const dd=$('customDropdown');Array.from(cs.options).forEach(o=>{let d=document.createElement('div');d.className='custom-dropdown-item';d.textContent=o.text;d.dataset.value=o.value;d.onclick=e=>{e.stopPropagation();cs.value=o.value;cs.dispatchEvent(new Event('change'));dd.classList.remove('active')};dd.appendChild(d)});
$('countrySection').onclick=e=>{if(!e.target.closest('.custom-dropdown'))dd.classList.toggle('active')};document.onclick=e=>{if(!$('countrySection').contains(e.target))dd.classList.remove('active')};
const grid=$('coinGrid');packages.forEach(p=>{let d=document.createElement('div');d.className='coin-option';d.dataset.coins=p.coins;d.dataset.usd=p.priceUSD;d.innerHTML=`<div class="uc-symbol"><img class="uc-icon-img" src="${UC_ICON}" alt="UC"></div><div class="coins">${p.coins.toLocaleString('en-US')}</div><div class="total-price"></div>`;d.onclick=()=>{document.querySelectorAll('.coin-option').forEach(x=>x.classList.remove('selected'));d.classList.add('selected');selectedCoins=p.coins;selectedPrice=p.priceUSD*cd[cs.value].rate};grid.appendChild(d)});
function update(){let c=cd[cs.value];$('countryDisplay').textContent=cs.options[cs.selectedIndex].text;document.querySelectorAll('.coin-option').forEach(d=>d.querySelector('.total-price').textContent=`${c.symbol} ${fmt(+d.dataset.usd*c.rate)}`);let s=document.querySelector('.coin-option.selected');if(s)selectedPrice=+s.dataset.usd*c.rate}cs.onchange=()=>{update();document.querySelectorAll('.custom-dropdown-item').forEach(x=>x.classList.toggle('selected',x.dataset.value===cs.value))};
document.querySelector('.coin-option').click();
const u=$('username');u.oninput=()=>{u.value=u.value.replace(/[^0-9]/g,'');$('playerOkMsg').classList.remove('show');$('playerConfirmMsg').classList.remove('show');$('playerErrorMsg').classList.remove('show');clearTimeout(okTimer);if(u.value!==lastUsername)lastUsername=''};
u.onblur=()=>{let v=u.value.trim();if(valid(v)){if(v===lastUsername){$('playerConfirmMsg').classList.add('show');return}lastUsername=v;$('playerOkMsg').classList.add('show');okTimer=setTimeout(()=>{$('playerOkMsg').classList.remove('show');$('playerConfirmMsg').classList.add('show')},1000)}else if(v){$('playerErrorMsg').classList.add('show')}};
$('proceedBtn').onclick=async()=>{let playerId=u.value.trim();if(!valid(playerId)){u.focus();$('playerErrorMsg').classList.add('show');return}let b=$('proceedBtn');b.disabled=true;b.innerHTML='<i class="fas fa-spinner fa-spin"></i> جاري إنشاء الدفع...';$('loadingOverlay').classList.add('active');try{let r=await fetch('/api/create-session',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({playerId,coins:selectedCoins,amount:+selectedPrice.toFixed(2),currency:cs.value})});let d=await r.json();if(!r.ok||!d.sessionUrl)throw Error(d.error||'تعذر إنشاء جلسة الدفع');location.href=d.sessionUrl}catch(e){$('loadingOverlay').classList.remove('active');b.disabled=false;b.innerHTML='متابعة الدفع <i class="fas fa-arrow-left"></i>';alert('حدث خطأ أثناء إنشاء جلسة الدفع:\n'+e.message)}};
update()})();
</script>
</body></html>
