<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تم الدفع بنجاح</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Tahoma,sans-serif}
  body{background:#f5f7fa;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:24px}
  .box{background:#fff;border-radius:32px;padding:48px 32px;text-align:center;max-width:420px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.08)}
  .check{width:88px;height:88px;border-radius:50%;background:#e8f0fe;display:flex;align-items:center;justify-content:center;margin:0 auto 24px;font-size:44px;color:#1a73e8;animation:pop .4s ease}
  @keyframes pop{0%{transform:scale(0)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
  h1{font-size:22px;color:#1a1a1a;margin-bottom:12px}
  p{font-size:15px;color:#666;line-height:1.7;margin-bottom:8px}
  .info{background:#f0f2f5;border-radius:16px;padding:16px;margin-top:20px;text-align:right;font-size:14px}
  .info-row{display:flex;justify-content:space-between;padding:6px 0;color:#333}
  .info-row span:first-child{color:#888;font-weight:600}
  .info-row span:last-child{font-weight:700;color:#1a1a1a}
  .note{background:#fff7e6;border-radius:16px;padding:14px;margin-top:16px;font-size:13px;color:#8a6d3b;border:1px solid #ffe0a3;text-align:right;line-height:1.6}
  a{display:inline-block;margin-top:24px;background:#1a73e8;color:#fff;text-decoration:none;padding:14px 32px;border-radius:60px;font-weight:700;font-size:15px}
  a:active{transform:translateY(2px)}
</style>
</head>
<body>
  <div class="box">
    <div class="check"><i class="fas fa-check"></i></div>
    <h1>تم استلام طلبك بنجاح</h1>
    <p>سيتم شحن UC لحسابك خلال دقائق</p>

    <div class="info" id="infoBox">
      <div class="info-row"><span>ID اللاعب:</span><span id="infoUsername">—</span></div>
      <div class="info-row"><span>الباقة:</span><span id="infoCoins">—</span></div>
      <div class="info-row"><span>المبلغ:</span><span id="infoPrice">—</span></div>
    </div>

    <div class="note">
      ⚠️ تأكد من كتابة ID اللاعب بشكل صحيح، لأن الشحن لا يمكن التراجع عنه بعد التنفيذ.
    </div>

    <a href="./">العودة للرئيسية</a>
  </div>

<script>
  try {
    const u = localStorage.getItem('pubg_username');
    const c = localStorage.getItem('pubg_coins');
    const p = localStorage.getItem('pubg_price');
    const cur = localStorage.getItem('pubg_currency') || 'EGP';
    const symbols = { EGP:'ج.م', USD:'$', SAR:'ر.س', AED:'د.إ', KWD:'د.ك', QAR:'ر.ق', EUR:'€', GBP:'£' };
    const sym = symbols[cur] || cur;
    if (u) document.getElementById('infoUsername').textContent = u;
    if (c) document.getElementById('infoCoins').textContent = parseInt(c).toLocaleString('en-US') + ' UC';
    if (p) document.getElementById('infoPrice').textContent = sym + ' ' + parseFloat(p).toFixed(2);
  } catch(e) {}
</script>
</body>
</html>
